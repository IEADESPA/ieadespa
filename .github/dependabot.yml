version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # TypeScript 7: o verificador de tipos do Astro (`astro check`) recusa o 7.0 ("use o 6"); revisar quando sair o 7.1 (docs/PLATAFORMAS.md).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node fica na linha do Node que realmente roda (22): a 26 descreveria recursos que o servidor não tem.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
