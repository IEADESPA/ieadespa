name: Governanca - CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - "site/**"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependências da API (pro runner de migrações)
        working-directory: api
        run: npm ci

      # vB.1 — testes das regras de dinheiro/estatuto primeiro (Jest, sem
      # banco real: shared/tesouraria.js, shared/demonstracoes.js,
      # shared/estatuto.js). Roda ANTES da migração/deploy — se uma regra de
      # dinheiro quebrar, o pipeline para aqui, não depois de já ter mexido
      # no banco de produção.
      - name: Rodar testes automatizados (regras de dinheiro e de estatuto)
        working-directory: api
        run: npm test

      # Um único step, uma única conexão, todas as migrações de sql/migrations/
      # em ordem (api/scripts/executar-migracoes.js) — antes eram 23 steps
      # separados, cada um pagando o custo fixo de ligar/conectar/desligar de
      # novo, mesmo com cada migração sendo idempotente e rápida por si só. Isso
      # não muda a regra de nunca editar uma migração antiga — só como elas são
      # executadas. Tem retry embutido pro Azure SQL Serverless acordar (mesmo
      # motivo do wretry que só cobria a migração 001 antes).
      # vD.3 (06/10/2026): pull request de homologação (branches `homolog…`) migra o banco de
      # HOMOLOGAÇÃO (`ieadespa-homolog`, segredo AZURE_SQL_CONNECTION_STRING_HOMOLOG) — até aqui
      # todo PR migrava a produção, e o banco de homologação ficou com o esquema atrasado.
      # Push na main continua migrando a produção.
      - name: Executar Migrações SQL
        working-directory: api
        env:
          SQL_CONNECTION_STRING: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'homolog')) && secrets.AZURE_SQL_CONNECTION_STRING_HOMOLOG || secrets.AZURE_SQL_CONNECTION_STRING }}
          ALVO_MIGRACAO: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'homolog')) && 'homologacao' || 'producao' }}
        run: |
          echo "Migrando o banco de: $ALVO_MIGRACAO"
          node scripts/executar-migracoes.js
          # vD.3: a homologação sempre tem massa fictícia (idempotente; o script se recusa a rodar fora de um banco "homolog").
          if [ "$ALVO_MIGRACAO" = "homologacao" ]; then node scripts/semear-homologacao.js; fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_048208E0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/app" # App source code path
          # REVERTIDO de novo (20/09, 2a tentativa) — api_location:"" (forma
          # correta, confirmada pela doc oficial) ainda assim não deixou
          # ligar func-ieadespa-api em produção (mesmo erro "preexisting
          # configuration" do Azure) — produção ficou sem API por alguns
          # minutos até esta reversão. Ver HOMOLOGACAO.md §
          # "Investigação de lentidão e custo" pro histórico completo.
          api_location: "api" # Api source code path - optional
          output_location: "/" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

      # vD.3 (07/10/2026): varredura de rotas no endereço que acabou de ser publicado — toda Function
      # responde sem sessão (401/400/405; nunca 404 nem 5xx) e o front tem todos os módulos. Pega o
      # módulo que não carrega no Azure (em 04/10 a homologação passou semanas respondendo 404 sem
      # ninguém ver). Push na main = produção; PR da homologação = o preview recém-montado.
      - name: Varredura de rotas no endereço publicado (vD.3)
        if: github.event_name == 'push' || startsWith(github.head_ref, 'homolog')
        working-directory: api
        env:
          ALVO: ${{ github.event_name == 'push' && 'https://app.ieadespa.org.br' || steps.builddeploy.outputs.static_web_app_url }}
        run: node scripts/varrer-rotas.js "$ALVO"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_048208E0F }}
          action: "close"
