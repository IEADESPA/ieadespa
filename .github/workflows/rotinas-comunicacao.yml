name: Rotina da fila de comunicados (a cada 15 minutos)

# v7.12 (Comunicação): o comunicado sai na hora pelo sininho e pelo celular; o e-mail vai por uma fila, porque o serviço de e-mail do Azure aceita 30 por minuto e 100 por hora
# no domínio da Igreja. Esta rotina chama a rota protegida por segredo (api/ComunicacaoFila), que manda a parte da rodada (Catálogos → Prazos: COMUNICACAO_EMAILS_POR_RODADA e
# COMUNICACAO_EMAILS_POR_HORA) e conclui os envios sem nada na fila.
#
# CUSTO: a chamada leva o cabeçalho `x-somente-se-pendente`: a rota pergunta antes a uma marca no Storage se há fila e, se não há, responde sem abrir o banco (o mesmo cuidado
# da rotina da proteção). Das 6h às 22h45 de Brasília manda tudo; das 23h às 5h45 (Trava 7-C) passa com `x-somente-sistema`: só o aviso de CRISE (Regimento Art. 161-B,
# v7.15) sai de madrugada, e o banco só é aberto se a marca disser que há aviso de crise na fila. O comunicado comum espera a manhã (ninguém recebe comunicado às 3h), e a
# primeira rodada das 6h continua de onde parou.
# Falhou: o job fica vermelho e o e-mail de falha sai, como nas outras rotinas.

on:
  schedule:
    # 6h às 22h45 de Brasília (UTC-3): a fila inteira
    - cron: "*/15 0-1,9-23 * * *"
    # 23h às 5h45 de Brasília: só o aviso de crise (Trava 7-C)
    - cron: "*/15 2-8 * * *"
  workflow_dispatch: {}

jobs:
  fila:
    runs-on: ubuntu-latest
    steps:
      - name: Uma rodada da fila de comunicados (v7.12)
        env:
          AGENDA: ${{ github.event.schedule }}
        run: |
          # de madrugada (o horário 2-8 UTC) só o aviso de crise; de dia (e no disparo manual) a fila inteira
          SO_SISTEMA=()
          if [ "$AGENDA" = "*/15 2-8 * * *" ]; then SO_SISTEMA=(-H "x-somente-sistema: 1"); fi
          # até 3 tentativas: a primeira chamada com fila paga o cold start da API
          for i in 1 2 3; do
            if curl -sf -m 120 -X POST "https://app.ieadespa.org.br/api/comunicacao-fila-interna" \
                 -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "x-somente-se-pendente: 1" "${SO_SISTEMA[@]}"; then echo; exit 0; fi
            echo "tentativa $i falhou"; sleep 30
          done
          exit 1

  avisar-falha:
    needs: [fila]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Avisar por e-mail
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          DESTINATARIO: presidente@ieadespa.org
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm install --silent --no-audit --no-fund @azure/communication-email@1 >/dev/null 2>&1
          node - <<'EOF'
          const { EmailClient } = require("@azure/communication-email");
          const agora = new Date().toLocaleString("pt-BR", { timeZone: "America/Belem" });
          (async () => {
            const client = new EmailClient(process.env.ACS_CONNECTION_STRING);
            const poller = await client.beginSend({
              senderAddress: "DoNotReply@ieadespa.org.br",
              content: {
                subject: "[IEADESPA] A fila de comunicados falhou",
                plainText: `A rotina da fila de comunicados falhou em ${agora}. Os e-mails de comunicado podem estar parados. Detalhes: ${process.env.RUN_URL}`
              },
              recipients: { to: [{ address: process.env.DESTINATARIO }] }
            });
            await poller.pollUntilDone();
          })().catch((e) => { console.error(e.message); process.exit(1); });
          EOF
