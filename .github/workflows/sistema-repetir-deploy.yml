name: Sistema - repetir deploy recusado pelo firewall do banco

# 18/11/2026: o banco (srv-app-sql) às vezes recusa o IP do runner do GitHub no passo "Executar Migrações SQL"
# ("Client with IP address ... is not allowed to access the server"). Um runner novo costuma vir com outro IP.
# Este fluxo repete as tarefas que falharam, no máximo até a 3ª tentativa, e SÓ quando o motivo é esse.
# Qualquer outra falha fica como está, para alguém olhar. Não mexe no firewall.
on:
  workflow_run:
    workflows: ["Governanca - CI/CD"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  repetir:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Repetir só se a falha foi o firewall do banco
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TENTATIVA: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          if gh run view "$RUN_ID" --repo "$REPO" --log-failed | grep -q "is not allowed to access the server"; then
            echo "A tentativa $TENTATIVA falhou no firewall do banco: repetindo as tarefas que falharam num runner novo."
            gh run rerun "$RUN_ID" --repo "$REPO" --failed
          else
            echo "A falha não foi o firewall do banco: nada a repetir (precisa de alguém olhar)."
          fi
