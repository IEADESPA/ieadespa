name: Sistema - testes de tela (vD.1)

# vD.1 (07/10/2026) — "toda tela abre, provado por máquina".
# Reaproveita o equipamento tools/csp-e2e (o mesmo que provou a CSP forte com 4.782 ações):
# descobre sozinho todo controle do front, aciona cada um com a API simulada dentro do
# navegador e compara, ação por ação, a versão ATUAL do app com a LINHA DE BASE aprovada
# (tools/csp-e2e/base/commit.txt = commit da base). Qualquer erro de JavaScript, violação de
# CSP, controle que sumiu ou tela que mudou de comportamento aparece como divergência.
#
# Mudança de tela intencional? Atualize tools/csp-e2e/base/commit.txt para o commit aprovado,
# no mesmo push — a mudança fica visível no diff, não escondida.
#
# Plano de ações e 1ª rodada da base ficam no cache do Actions (chave = commit da base):
# só a primeira rodada de cada base paga a descoberta; as seguintes rodam só a versão atual.
# Modo --rapido (uma ação por manipulador distinto); a rodada completa fica para o disparo
# manual (workflow_dispatch com completo=sim) e para as Travas de Revisão.

on:
  push:
    # main = produção; homolog = a homologação do sistema (PR #1): uma mudança de tela é provada lá ANTES de ir para a main
    branches: [main, homolog]
    paths:
      - "app/**"
      - "tools/csp-e2e/**"
      - ".github/workflows/sistema-testes-tela.yml"
  workflow_dispatch:
    inputs:
      completo:
        description: "Rodada completa (todas as ações) em vez do modo rápido"
        required: false
        default: "nao"

permissions:
  contents: read

concurrency:
  # uma fila por ramo: a rodada da homolog não derruba a da main (nem o contrário)
  group: sistema-testes-tela-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAVEGADOR: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar o equipamento (puppeteer-core, sem baixar navegador)
        working-directory: tools/csp-e2e
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --no-audit --no-fund --silent

      - name: Extrair a linha de base (app/ do commit aprovado)
        id: base
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < tools/csp-e2e/base/commit.txt)"
          git cat-file -e "$base^{commit}" || { echo "::error::commit da base não existe: $base"; exit 1; }
          mkdir -p tools/csp-e2e/base/app-base
          git archive "$base" app | tar -x -C tools/csp-e2e/base/app-base
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Linha de base: $base ($(git log -1 --format=%s "$base" | cut -c1-80))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Plano e 1ª rodada da base (cache por commit da base)
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: tools/csp-e2e/planos
          # v2 (07/10/2026, vD.6): o retrato ganhou a rolagem lateral — plano e transcritos antigos não comparam
          # v3 (08/10/2026): repesca das falhas do equipamento antes de gravar a linha de base
          key: csp-e2e-plano-${{ steps.base.outputs.sha }}-v3

      - name: Rodar o plano na versão atual e comparar com a base
        working-directory: tools/csp-e2e
        run: |
          set -o pipefail
          modo="--rapido"
          [ "${{ github.event.inputs.completo }}" = "sim" ] && modo=""
          node rodar.js --original base/app-base/app --nova ../../app $modo --workers 4 --navegadores 2 --sem-especiais --saida resultados 2>&1 | tee saida.txt
          codigo=${PIPESTATUS[0]}
          { echo '```'; grep -E 'BASELINE|Modo rápido|Plano (reaproveitado|salvo)|RESULTADO|VIOLAÇÕES|ESTABILIDADE|ações em [0-9]+ s' saida.txt | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo

      - name: Guardar o relatório e as divergências
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testes-de-tela-${{ github.run_number }}
          path: |
            tools/csp-e2e/resultados/

      - name: Salvar a linha de base no cache (mesmo se a comparação falhou — a descoberta vale por si)
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tools/csp-e2e/planos
          key: csp-e2e-plano-${{ steps.base.outputs.sha }}-v3

  # vD.6 (07/10/2026): as mesmas ações do perfil MEMBRO numa janela de celular (360×740). Além de tudo o que a
  # rodada de cima compara, cada tela traz a rolagem lateral em px: uma tela que passou a estourar a largura do
  # celular vira divergência, não reclamação. Plano próprio (a tela descoberta é outra: gaveta do menu).
  celular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAVEGADOR: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar o equipamento (puppeteer-core, sem baixar navegador)
        working-directory: tools/csp-e2e
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --no-audit --no-fund --silent

      - name: Extrair a linha de base (app/ do commit aprovado)
        id: base
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < tools/csp-e2e/base/commit.txt)"
          git cat-file -e "$base^{commit}" || { echo "::error::commit da base não existe: $base"; exit 1; }
          mkdir -p tools/csp-e2e/base/app-base
          git archive "$base" app | tar -x -C tools/csp-e2e/base/app-base
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Plano e 1ª rodada da base em janela de celular (cache por commit da base)
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: tools/csp-e2e/planos
          key: csp-e2e-plano-${{ steps.base.outputs.sha }}-celular-v3

      - name: Rodar o plano do membro em 360×740 e comparar com a base
        working-directory: tools/csp-e2e
        run: |
          set -o pipefail
          modo="--rapido"
          [ "${{ github.event.inputs.completo }}" = "sim" ] && modo=""
          node rodar.js --original base/app-base/app --nova ../../app --perfis membro --celular $modo --workers 4 --navegadores 2 --sem-especiais --saida resultados 2>&1 | tee saida.txt
          codigo=${PIPESTATUS[0]}
          { echo '### Celular 360×740 (perfil membro)'; echo '```'; grep -E 'JANELA|Modo rápido|Plano (reaproveitado|salvo)|RESULTADO|VIOLAÇÕES|ações em [0-9]+ s' saida.txt | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo

      - name: Guardar o relatório e as divergências (celular)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testes-de-tela-celular-${{ github.run_number }}
          path: |
            tools/csp-e2e/resultados/
            tools/csp-e2e/saida.txt
          retention-days: 30

      - name: Salvar a linha de base no cache (mesmo se a comparação falhou — a descoberta vale por si)
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tools/csp-e2e/planos
          key: csp-e2e-plano-${{ steps.base.outputs.sha }}-celular-v3
