name: Site - remontar quando o Directus mudar

# Por que existe (06/10/2026)
# ---------------------------
# O site é estático: conteúdo editado no Directus só aparece quando o site é remontado.
# O Flow do Directus "Publicar site (avisar GitHub)" fazia isso chamando o GitHub com um
# token pessoal — que venceu em silêncio (401; última remontagem automática em 01/10).
# Este fluxo dispensa token pessoal: a cada poucos minutos (ver "Frequência" abaixo) calcula a "versão" do conteúdo
# (site/scripts/conteudo-versao.mjs: hash do conteúdo inteiro das 20 coleções que o site
# lê, com o segredo DIRECTUS_ADMIN_TOKEN já usado pelos avisos) e, se mudou desde a última
# remontagem, manda montar o site e disparar os avisos de conteúdo novo — tudo com o
# GITHUB_TOKEN do próprio robô (gh workflow run), que o GitHub dá de graça.
#
# O que NÃO faz: não toca na API do sistema (não acorda o banco Azure SQL). A agenda
# oficial continua com o site-agenda-sync.yml, 3 vezes por dia. Uma remontagem em si lê a
# agenda do sistema uma vez (é o build), como qualquer remontagem.
#
# Memória de "última versão remontada": o CACHE do GitHub Actions, com a chave
# conteudo-versao-<hash> (o GITHUB_TOKEN não pode gravar variáveis do repositório —
# "Resource not accessible by integration" —, mas o cache ele sempre pode usar). Cache
# existe para essa versão = já remontado. O cache some depois de 7 dias sem uso; como é
# consultado a cada poucos minutos, só some se o conteúdo ficar 7 dias parado — e aí a única
# consequência é uma remontagem a mais. Build já na fila/em andamento: não dispara outro
# nem grava a memória — o próximo tique confere de novo.

# Frequência (17/10/2026): o GitHub atrasa e derruba parte dos disparos agendados. Medido em 12 h com "*/15": o intervalo REAL entre
# execuções foi de 10 a 54 minutos (mediana 19) — a Marcha foi ativada e a página só apareceu mais de 20 minutos depois. Com "*/5" a
# mediana medida em outro fluxo foi 10 min (máx. 40). Por isso dois relógios independentes, defasados, de 5 em 5 minutos (cada linha é
# um disparo próprio, então a perda de um não deixa o site parado), fora dos minutos redondos, onde o GitHub atrasa mais. Custa pouco:
# a conferência é uma leitura de ~20 coleções do Directus (~25 s de robô) e, sem mudança, não faz mais nada.
on:
  schedule:
    - cron: "1-59/5 * * * *"
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write # gh workflow run
  contents: read

concurrency:
  group: site-conteudo-sync
  cancel-in-progress: false

jobs:
  conferir:
    name: Comparar a versão do conteúdo com a última remontagem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKFLOW_SITE: azure-static-web-apps-salmon-bay-0efd06d0f.yml
      WORKFLOW_AVISOS: site-content-notifications.yml
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DIRECTUS_URL: https://ieadespa-directus-gae4hfarf4a4ffcf.brazilsouth-01.azurewebsites.net
      DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: site/scripts/conteudo-versao.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Calcular a versão atual do conteúdo
        id: atual
        run: |
          set -euo pipefail
          versao="$(node site/scripts/conteudo-versao.mjs --v)"
          [[ "$versao" =~ ^[0-9a-f]{16}$ ]] || { echo "::error::versão inválida: '$versao'"; exit 1; }
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "Versão do conteúdo agora: $versao"

      - name: Esta versão já foi remontada? (cache existe = sim)
        id: memoria
        uses: actions/cache/restore@v6
        with:
          path: .conteudo-versao
          key: conteudo-versao-${{ steps.atual.outputs.versao }}
          lookup-only: true

      - name: Sem mudança
        if: steps.memoria.outputs.cache-hit == 'true'
        run: echo "Sem mudança no conteúdo (versão ${{ steps.atual.outputs.versao }} já remontada). Nada a fazer." >> "$GITHUB_STEP_SUMMARY"

      - name: Conteúdo mudou — remontar o site (se não houver remontagem em andamento)
        if: steps.memoria.outputs.cache-hit != 'true'
        id: remontar
        run: |
          set -euo pipefail
          atual="${{ steps.atual.outputs.versao }}"
          em_andamento="$(gh run list --workflow "$WORKFLOW_SITE" --status in_progress --json databaseId --jq 'length')"
          na_fila="$(gh run list --workflow "$WORKFLOW_SITE" --status queued --json databaseId --jq 'length')"
          if [ "${em_andamento:-0}" != "0" ] || [ "${na_fila:-0}" != "0" ]; then
            echo "Conteúdo mudou (versão $atual), mas já há remontagem em andamento/fila; espero o próximo tique." >> "$GITHUB_STEP_SUMMARY"
            echo "disparou=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh workflow run "$WORKFLOW_SITE" --ref main
          gh workflow run "$WORKFLOW_AVISOS" --ref main || echo "::warning::não consegui disparar os avisos de conteúdo (segue sem eles)"
          mkdir -p .conteudo-versao && echo "$atual" > .conteudo-versao/versao
          echo "disparou=sim" >> "$GITHUB_OUTPUT"
          echo "Conteúdo mudou (versão $atual): remontagem do site e avisos disparados." >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar que esta versão foi remontada
        if: steps.remontar.outputs.disparou == 'sim'
        uses: actions/cache/save@v6
        with:
          path: .conteudo-versao
          key: conteudo-versao-${{ steps.atual.outputs.versao }}
