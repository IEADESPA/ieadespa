name: Site - testes contra o site publicado

# Por que existe (06/10/2026 — vD.8)
# ----------------------------------
# Depois de cada montagem do site institucional, roda as baterias de site/scripts/testes
# contra o endereço que acabou de ser publicado:
#   - qualquer pull request → a PRÉ-VISUALIZAÇÃO daquele PR no Azure Static Web Apps
#     (https://salmon-bay-0efd06d0f-<nº do PR>.eastus2.3.azurestaticapps.net; criada na montagem
#     do PR, destruída quando ele fecha, herda as configurações da produção);
#   - branch `main` → a PRODUÇÃO (https://ieadespa.org.br).
# Fluxo do site (07/10/2026): UMA mudança = UM pull request; testes verdes na pré-visualização →
# merge → produção. (Um PR "permanente" não serve: qualquer merge dos commits dele o fecha e o
# ambiente some — foi o que aconteceu com o PR #18 em 06/10.)
# Os dados de teste são criados e apagados na hora, no Directus de produção (não há Directus
# de homologação, por custo), em itens "teste-…" que a versão do conteúdo ignora.
# Também pode ser rodado à mão, informando o endereço.

on:
  workflow_run:
    workflows: ["Site institucional - CI/CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      site_url:
        description: "Endereço do site a testar (padrão: produção)"
        required: false
        default: "https://ieadespa.org.br"

permissions:
  contents: read
  pull-requests: read

jobs:
  testar:
    # Toda montagem bem-sucedida: a da main (produção) e a de qualquer pull request (pré-visualização).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DIRECTUS_URL: https://ieadespa-directus-gae4hfarf4a4ffcf.brazilsouth-01.azurewebsites.net
      DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_ADMIN_TOKEN }}
      TELEFONE_CHAVE_SEGREDO: ${{ secrets.TELEFONE_CHAVE_SEGREDO }}
    steps:
      - uses: actions/checkout@v7
        with:
          # o commit, não o branch: quando o PR é mesclado e o branch apagado, o checkout pelo nome falhava
          # (07/10/2026) antes de o passo seguinte perceber que não há PR aberto e pular os testes
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: site/scripts/testes
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Decidir o endereço a testar
        id: alvo
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            url="${{ github.event.inputs.site_url }}"
          elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            url="https://ieadespa.org.br"
          else
            # Pull request: a pré-visualização do Static Web App tem o número do PR no endereço
            # (ambiente criado na montagem do PR e destruído quando ele fecha; herda as
            # configurações da produção).
            ramo="${{ github.event.workflow_run.head_branch }}"
            pr="$(gh pr list --head "$ramo" --state open --json number --jq '.[0].number')"
            if [ -z "$pr" ]; then echo "Sem PR aberto para o branch $ramo (já fechado ou mesclado): nada a testar." | tee -a "$GITHUB_STEP_SUMMARY"; echo "url=" >> "$GITHUB_OUTPUT"; exit 0; fi
            url="https://salmon-bay-0efd06d0f-${pr}.eastus2.3.azurestaticapps.net"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Testando: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Espera o endereço responder (a pré-visualização leva uns segundos depois do deploy).
          for i in $(seq 1 12); do curl -sf -o /dev/null -m 20 "$url/" && break; sleep 10; done

      - name: Camisetas
        if: steps.alvo.outputs.url != ''
        env:
          SITE_URL: ${{ steps.alvo.outputs.url }}
        run: node site/scripts/testes/camisetas.cjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Eventos
        if: always() && steps.alvo.outputs.url != ''
        env:
          SITE_URL: ${{ steps.alvo.outputs.url }}
        run: node site/scripts/testes/eventos.cjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
