<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Verificar certificado — IEADESPA</title>
  <!-- v6.9 — página PÚBLICA (sem login) de verificação de certificado. Autônoma de
       propósito: não carrega o app, não usa cookie nem armazenamento local. O QR
       do certificado aponta pra cá com o código; quem só tem o papel digita o
       código. Toda regra está em api/VerificarCertificado (o que mostrar, o que
       esconder). Aqui só se exibe a resposta — sempre com textContent, nunca HTML. -->
  <style>
    :root { --marinho: #0f1b33; --ouro: #d9b34f; --cinza: #5a6270; --fundo: #f6f7f9; --ok: #1d7a46; --alerta: #b26a00; --erro: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: #1a1d23; }
    header { background: var(--marinho); color: #fff; padding: 18px 16px; text-align: center; border-bottom: 4px solid var(--ouro); }
    header h1 { margin: 0; font-size: 1.05rem; letter-spacing: .02em; }
    header p { margin: 4px 0 0; font-size: .8rem; color: #c9d1e0; }
    main { max-width: 560px; margin: 24px auto; padding: 0 16px 40px; }
    .cartao { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(15, 27, 51, .12); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase; border: 1px solid #b8bec9; border-radius: 8px; font-family: ui-monospace, Consolas, monospace; }
    button { margin-top: 12px; width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; background: var(--marinho); color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .dica { font-size: .8rem; color: var(--cinza); margin: 8px 0 0; }
    #resultado { margin-top: 20px; }
    .selo { border-radius: 12px; padding: 18px; border: 2px solid; }
    .selo h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .selo.valido { border-color: var(--ok); background: #eaf6ee; } .selo.valido h2 { color: var(--ok); }
    .selo.vencido { border-color: var(--alerta); background: #fff4e2; } .selo.vencido h2 { color: var(--alerta); }
    .selo.invalido { border-color: var(--erro); background: #fdecea; } .selo.invalido h2 { color: var(--erro); }
    dl { margin: 12px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: .92rem; }
    dt { color: var(--cinza); } dd { margin: 0; font-weight: 600; word-break: break-word; }
    footer { text-align: center; font-size: .75rem; color: var(--cinza); margin-top: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>IGREJA EVANGÉLICA ASSEMBLEIA DE DEUS — IEADESPA</h1>
    <p>Verificação de certificado</p>
  </header>
  <main>
    <div class="cartao">
      <form id="form" autocomplete="off">
        <label for="codigo">Código de verificação</label>
        <input id="codigo" name="codigo" inputmode="text" maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" />
        <p class="dica">O código está impresso no certificado, logo abaixo do QR Code.</p>
        <button id="botao" type="submit">Verificar</button>
      </form>
      <div id="resultado" role="status" aria-live="polite"></div>
    </div>
    <footer>Esta consulta não exige login e não guarda dados de quem consulta.</footer>
  </main>
  <script>
    (function () {
      var campo = document.getElementById("codigo"), botao = document.getElementById("botao"), saida = document.getElementById("resultado");

      function limpar(texto) { return String(texto || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
      function formatar(texto) { var c = limpar(texto); return c.length === 16 ? c.match(/.{4}/g).join("-") : c; }
      function dataBr(iso) { return iso ? String(iso).slice(8, 10) + "/" + String(iso).slice(5, 7) + "/" + String(iso).slice(0, 4) : ""; }

      function el(tag, classe, texto) {
        var e = document.createElement(tag);
        if (classe) e.className = classe;
        if (texto !== undefined) e.textContent = texto;
        return e;
      }

      function mostrar(classe, titulo, mensagem, dados) {
        saida.textContent = "";
        var caixa = el("div", "selo " + classe);
        caixa.appendChild(el("h2", "", titulo));
        if (mensagem) caixa.appendChild(el("p", "", mensagem));
        if (dados && dados.length) {
          var lista = el("dl");
          dados.forEach(function (par) { lista.appendChild(el("dt", "", par[0])); lista.appendChild(el("dd", "", par[1])); });
          caixa.appendChild(lista);
        }
        saida.appendChild(caixa);
      }

      function dadosDoCertificado(r) {
        var dados = [["Titular", r.nome], ["Certificado", r.titulo], ["Protocolo", r.protocolo], ["Emitido em", dataBr(r.dataEmissao)]];
        dados.push(["Validade", r.validoAte ? "até " + dataBr(r.validoAte) : "não vence"]);
        if (r.revogadoEm) dados.push(["Revogado em", dataBr(r.revogadoEm)]);
        return dados;
      }

      async function verificar(codigoBruto) {
        var codigo = limpar(codigoBruto);
        if (codigo.length !== 16) { mostrar("invalido", "Código incompleto", "O código tem 16 letras e números (formato XXXX-XXXX-XXXX-XXXX). Confira o que está impresso no certificado."); return; }
        campo.value = formatar(codigo);
        botao.disabled = true;
        saida.textContent = "Verificando…";
        try {
          var res = await fetch("/api/verificacao-certificado/" + encodeURIComponent(codigo), { headers: { Accept: "application/json" }, cache: "no-store" });
          var r = await res.json();
          if (r.situacao === "VALIDO") mostrar("valido", "✅ Certificado autêntico e válido", "Os dados abaixo conferem com o registro da IEADESPA.", dadosDoCertificado(r));
          else if (r.situacao === "VENCIDO") mostrar("vencido", "⏰ Certificado autêntico, mas com a validade vencida", "Foi emitido pela IEADESPA, porém a validade acabou.", dadosDoCertificado(r));
          else if (r.situacao === "REVOGADO") mostrar("invalido", "⛔ Certificado REVOGADO", "Este certificado foi emitido, mas foi revogado e não tem mais validade.", dadosDoCertificado(r));
          else if (r.situacao === "INTEGRIDADE_FALHOU") mostrar("invalido", "⚠️ Não foi possível confirmar este certificado", r.mensagem);
          else if (r.situacao === "NAO_ENCONTRADO") mostrar("invalido", "Certificado não encontrado", "Nenhum certificado com este código. Confira o código impresso — se estiver certo, o documento pode não ser autêntico.");
          else mostrar("invalido", "Não foi possível verificar agora", r.mensagem || "Tente novamente em instantes.");
        } catch (e) {
          mostrar("invalido", "Não foi possível verificar agora", "Sem conexão com o servidor. Tente novamente em instantes.");
        } finally {
          botao.disabled = false;
        }
      }

      document.getElementById("form").addEventListener("submit", function (ev) { ev.preventDefault(); verificar(campo.value); });
      var inicial = new URLSearchParams(location.search).get("c");
      if (inicial) verificar(inicial);
    })();
  </script>
</body>
</html>
