<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Verificar certificado — IEADESPA</title>
  <!-- v6.9 — página PÚBLICA (sem login) de verificação de certificado. Autônoma de
       propósito: não carrega o app, não usa cookie nem armazenamento local. O QR
       do certificado aponta pra cá com o código; quem só tem o papel digita o
       código. Toda regra está em api/VerificarCertificado (o que mostrar, o que
       esconder). Aqui só se exibe a resposta — sempre com textContent, nunca HTML. -->
  <link rel="stylesheet" href="verificar.css" />
</head>
<body>
  <header>
    <h1>IGREJA EVANGÉLICA ASSEMBLEIA DE DEUS — IEADESPA</h1>
    <p>Verificação de certificado</p>
  </header>
  <main>
    <div class="cartao">
      <form id="form" autocomplete="off">
        <label for="codigo">Código de verificação</label>
        <input id="codigo" name="codigo" inputmode="text" maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" />
        <p class="dica">O código está impresso no certificado, logo abaixo do QR Code.</p>
        <button id="botao" type="submit">Verificar</button>
      </form>
      <div id="resultado" role="status" aria-live="polite"></div>
    </div>
    <footer>Esta consulta não exige login e não guarda dados de quem consulta.</footer>
  </main>
  <script src="verificar.js"></script>
</body>
</html>
