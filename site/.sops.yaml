# SOPS + age — criptografia dos segredos do projeto
#
# Este arquivo diz ao SOPS quais chaves age podem criptografar novos arquivos.
# O arquivo de segredos criptografado (`secrets.env`) guarda as chaves
# públicas de TODOS os destinatários no próprio metadado; aqui ficam as regras
# de criação usadas ao gerar/encriptar um arquivo novo.
#
# Como funciona o compartilhamento entre máquinas (ver CRIPTOGRAFIA.md):
#   1. Cada pessoa gera o par de chaves com `age-keygen` e manda SÓ a pública.
#   2. Adicione a chave pública abaixo e rode `sops updatekeys` nos arquivos.
#   3. A partir daí, as duas máquinas conseguem abrir/editar os mesmos arquivos.
creation_rules:
  # Segredos do ambiente raiz: .env.local (texto puro, local) e secrets.env (criptografado).
  - path_regex: (^|/)(\.env\.local|secrets\.env)$
    age: age1tcc555f5hzy0dv87mkuup56yrghh7c235y2dpfeyy2rqjrv92aaqqtevtn

  # Segredos das Azure Functions: api/local.settings.json (texto puro, local)
  # e api/local.settings.enc.json (criptografado). Aceita / ou \ como separador.
  - path_regex: '(^|[\\/])api[\\/]local\.settings(\.enc)?\.json$'
    age: age1tcc555f5hzy0dv87mkuup56yrghh7c235y2dpfeyy2rqjrv92aaqqtevtn
